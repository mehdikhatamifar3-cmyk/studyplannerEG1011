    const areas=html('div','p-areas');for(const area of p.areas){const button=html('button','p-area-link'),total=area.counts.reduce((a,b)=>a+b,0);button.type='button';button.appendChild(html('strong','',area.name));
      const stack=html('div','p-stack');stack.setAttribute('aria-hidden','true');area.counts.forEach((count,index)=>{if(!count)return;const segment=html('i');segment.style.flex=count;segment.style.setProperty('--status',states[index].color);stack.appendChild(segment);});button.append(stack,html('small','',area.counts[3]+' / '+total+' independent'));
      button.setAttribute('aria-label','Explore '+area.name+': '+area.counts.map((count,index)=>count+' '+states[index].label).join(', '));button.addEventListener('click',()=>{progressUI.area=area.name;progressUI.status='all';progressUI.query='';areaSelect.value=area.name;statusSelect.value='all';search.value='';drawTopics();map.scrollIntoView({behavior:motionAllowed()?'smooth':'auto',block:'start'});});areas.appendChild(button);
    }summary.appendChild(areas);top.appendChild(summary);
    const next=html('section','p-card p-next'),first=p.actions[0];next.appendChild(html('p','p-kicker','Your next useful step'));
    const counts=html('div','p-attention-counts');counts.append(html('span','',p.attention+' topic'+(p.attention===1?'':'s')+' to revisit'),html('span','',p.due_count+' suggested review'+(p.due_count===1?'':'s')));next.appendChild(counts);
    if(first){next.append(html('h4','',first.title),html('p','p-sub',first.reason));const buttons=html('div','p-button-row');
      const practise=html('button','p-main-action','Practise this topic');practise.type='button';practise.addEventListener('click',()=>value({kind:'topic',id:first.id,view:'My pathway'}));
      const assess=html('button','p-secondary-action','View my rating');assess.type='button';assess.addEventListener('click',()=>choose(first.id,true));buttons.append(practise,assess);next.appendChild(buttons);
      if(p.actions.length>1){const others=html('div','p-other-next');p.actions.slice(1).forEach(action=>{const b=html('button','',action.label+' · '+byId[action.id].short_title);b.type='button';b.addEventListener('click',()=>choose(action.id,true));others.appendChild(b);});next.appendChild(others);}
    }top.appendChild(next);dash.appendChild(top);
    const recent=html('section','p-card p-recent'),recentText=html('div'),recentHelp=html('p','p-recent-help','Latest saved dates for ratings, completion marks, concept checks and notebook entries. Select a day for details.');recentHelp.setAttribute('aria-live','polite');const recorded=p.recent.reduce((sum,d)=>sum+d.total,0);recentText.append(html('h3','','Recent saved work'),html('p','p-sub',recorded?recorded+' saved records in the last 14 days': 'Your saved work will appear here as you practise.'));recent.appendChild(recentText);
    const days=html('div','p-days');days.setAttribute('role','list');p.recent.forEach(day=>{const cell=html('div','p-activity-day');cell.setAttribute('role','listitem');const label=niceDate(day.date)+': '+day.ratings+' ratings, '+day.activities+' activity marks, '+day.checks+' concept checks, '+day.notes+' notes';cell.title=label;const square=html('button','p-activity-cell',day.total>9?'9+':day.total||'');square.type='button';square.setAttribute('aria-label',label);for(const event of ['pointerenter','focus','click'])square.addEventListener(event,()=>{recentHelp.textContent=label;});const shades=['#eef2f6','#dbeee5','#b1d6c5','#6fae94','#287b60'];square.style.setProperty('--activity-fill',shades[Math.min(day.total,4)]);if(day.total>=4)square.style.setProperty('--activity-ink','#fff');cell.append(square,html('small','',new Date(day.date+'T12:00:00').getDate()));days.appendChild(cell);});recent.append(days,recentHelp);dash.appendChild(recent);
    const workspace=html('div','p-workspace'),map=html('section','p-card p-topic-map'),inspector=html('section','p-card p-inspector');inspector.setAttribute('aria-label','Selected topic self-assessment');
    const head=html('div','p-map-heading'),headText=html('div');headText.append(html('h3','','Explore your topics'),html('p','p-sub','Select a topic to see evidence and update your rating.'));const shown=html('span','');shown.setAttribute('aria-live','polite');head.append(headText,shown);map.appendChild(head);
    const filters=html('div','p-filters');
    function filter(label,tag,cls=''){const wrap=html('label','p-filter '+cls);wrap.appendChild(html('span','',label));const input=html(tag);input.setAttribute('aria-label',label);wrap.appendChild(input);filters.appendChild(wrap);return input;}
    const areaSelect=filter('Subject area','select');['All areas','Statics','Dynamics','Foundations'].forEach(name=>{const option=html('option','',name);option.value=name;areaSelect.appendChild(option);});areaSelect.value=progressUI.area;
    const statusSelect=filter('Show topics','select');[['all','All ratings'],['attention','Needs attention'],['due','Review suggested'],...states.map((state,i)=>[String(i),state.label])].forEach(([id,label])=>{const option=html('option','',label);option.value=id;statusSelect.appendChild(option);});statusSelect.value=progressUI.status;
    const search=filter('Find a topic','input','search');search.type='search';search.placeholder='Search by topic name…';search.value=progressUI.query;map.appendChild(filters);const topics=html('div','p-topics');map.appendChild(topics);
    function matches(row){return (progressUI.area==='All areas'||row.area===progressUI.area)&&(progressUI.status==='all'||progressUI.status==='attention'&&row.needs_attention||progressUI.status==='due'&&row.due||String(row.level)===progressUI.status)&&(!progressUI.query|| (row.title+' '+row.short_title).toLocaleLowerCase().includes(progressUI.query.toLocaleLowerCase()));}
    function drawTopics(){topics.replaceChildren();const rows=p.topics.filter(matches);shown.textContent=rows.length+' topic'+(rows.length===1?'':'s');
      if(!rows.length){topics.appendChild(html('p','p-empty','No topics match these filters. Try another subject, rating or search.'));height();return;}
      const groups=new Map();rows.forEach(row=>{const key=row.area+(row.session?' · Session '+row.session:'');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row);});
      for(const [label,items]of groups){const section=html('section','p-topic-group');section.appendChild(html('h4','',label));const grid=html('div','p-topic-grid');for(const row of items){const state=states[row.level],tile=html('button','p-topic-tile');tile.type='button';tile.dataset.topic=row.id;tile.dataset.level=row.level;tile.style.setProperty('--status',state.color);tile.setAttribute('aria-pressed',String(progressUI.selected===row.id));tile.setAttribute('aria-label',row.title+' · '+state.label+(row.needs_attention?' · Needs attention':row.due?' · Review suggested':''));
          const copy=html('span','p-tile-copy');copy.append(html('strong','',row.short_title),html('small','',state.short));tile.append(html('span','p-topic-symbol',state.symbol),copy);if(row.needs_attention||row.due)tile.appendChild(html('span','p-tile-flag',row.needs_attention?'Revisit':'Review'));tile.addEventListener('click',()=>choose(row.id,false));grid.appendChild(tile);}section.appendChild(grid);topics.appendChild(section);}height();
    }
    function choose(id,reveal){progressUI.selected=id;if(reveal){progressUI.area=byId[id].area;progressUI.status='all';progressUI.query='';areaSelect.value=progressUI.area;statusSelect.value='all';search.value='';}drawTopics();drawInspector();if(reveal||innerWidth<=660){inspector.scrollIntoView({behavior:motionAllowed()?'smooth':'auto',block:'start'});inspector.querySelector('h3').focus({preventScroll:true});}}
    function drawInspector(){inspector.replaceChildren();const row=byId[progressUI.selected];if(!row)return;const state=states[row.level];inspector.style.setProperty('--status',state.color);inspector.dataset.topic=row.id;
      inspector.append(html('p','p-kicker',row.area+(row.session?' · Session '+row.session:' · Essential skills')));const title=html('h3','',row.title);title.tabIndex=-1;inspector.appendChild(title);
      const status=html('div','p-rating-summary');status.append(html('strong','',state.label));if(row.rated_on)status.appendChild(html('span','','Saved '+niceDate(row.rated_on)));if(row.review_on)status.appendChild(html('span','',row.due?'Review suggested now':'Next review · '+niceDate(row.review_on)));inspector.appendChild(status);
      const prompt=html('div','p-prompt');prompt.append(html('strong','','Try this before you rate'),html('p','',row.practice_prompt));inspector.appendChild(prompt);
      const form=html('form','p-rating-form'),fieldset=html('fieldset');fieldset.appendChild(html('legend','','On a fresh problem, what can you do?'));
      states.forEach((choice,index)=>{const label=html('label','p-rating-choice');label.style.setProperty('--status',choice.color);const input=html('input');input.type='radio';input.name='topic-rating';input.value=index;input.checked=index===row.level;label.append(input,html('span','',choice.label));fieldset.appendChild(label);});form.append(fieldset,html('p','p-rating-hint','Use “independently” when you can solve a fresh problem and explain your method with notes closed.'));
      const save=html('button','p-save-rating','Save my self-assessment');save.type='submit';save.dataset.saveRating='true';form.appendChild(save);form.addEventListener('submit',e=>{e.preventDefault();const rating=Number(new FormData(form).get('topic-rating'));progressUI.pending={id:row.id,level:rating};save.disabled=true;save.textContent='Saving…';value({kind:'progress_rate',topic_id:row.id,level:rating});});inspector.appendChild(form);
      if(saved?.id===row.id&&saved.level===row.level){const notice=html('p','p-save-notice','✓ Self-assessment saved. Your practice recommendations are updated.');notice.setAttribute('role','status');inspector.appendChild(notice);}
      if(row.check){const check=html('p','p-check-evidence'+(row.check.correct?'':' retry'),(row.check.correct?'Latest concept check: correct':'Latest concept check: try this idea again')+' · '+niceDate(row.check.date));inspector.appendChild(check);}
      const buttons=html('div','p-button-row p-topic-actions'),practice=html('button','p-main-action','Open learning pathway'),weekly=html('button','p-secondary-action','Plan this topic');practice.type=weekly.type='button';practice.addEventListener('click',()=>value({kind:'topic',id:row.id,view:'My pathway'}));weekly.addEventListener('click',()=>value({kind:'plan_topic',topic_id:row.id}));buttons.append(practice,weekly);inspector.appendChild(buttons);
      const evidence=html('details','p-evidence-details'),marked=row.materials.filter(m=>m.completed).length;evidence.appendChild(html('summary','',marked+' / '+row.materials.length+' materials marked · learning evidence'));
      const list=html('div','p-material-evidence');row.materials.forEach(material=>{const record=html('div','p-material-record'),symbol=html('i','',material.symbol);symbol.style.setProperty('--c',material.color);record.append(symbol,html('span','',material.title));if(material.completed)record.appendChild(html('b','','✓ Marked'));list.appendChild(record);});evidence.append(list,html('p','','Completion marks record activity. Your rating describes what you can solve. A concept check tests one idea.'));
      const source=row.source;evidence.appendChild(html('p','',source.file+' · '+(source.pages[0]===source.pages[1]?'p. '+source.pages[0]:'pp. '+source.pages[0]+'–'+source.pages[1])));if(row.notes_count)evidence.appendChild(html('p','',row.notes_count+' saved '+(row.notes_count===1?'note':'notes')+' for this topic in the practice notebook below.'));inspector.appendChild(evidence);height();
    }
    areaSelect.addEventListener('change',()=>{progressUI.area=areaSelect.value;drawTopics();});statusSelect.addEventListener('change',()=>{progressUI.status=statusSelect.value;drawTopics();});search.addEventListener('input',()=>{progressUI.query=search.value;drawTopics();});
    workspace.append(map,inspector);dash.appendChild(workspace);drawTopics();drawInspector();dash.appendChild(html('p','p-sticky-note','Not checked means you have not assessed that skill yet. Revisit badges flag your own practice rating or a concept-check difficulty; review badges are suggested recall dates.'));
    if(saved)requestAnimationFrame(()=>inspector.querySelector('[data-save-rating]')?.focus({preventScroll:true}));
  }

  function storage(){
    const status=html('div','storage');root.appendChild(status);
    try{
      if(args.restore){
        if(storageBoot!==args.boot){storageBoot=args.boot;const text=localStorage.getItem(STORAGE_KEY);let saved=null;if(text){if(text.length>200000)throw Error('Backup too large');saved=JSON.parse(text);}value({kind:'restore',data:saved});}
        status.textContent='Loading your progress…';
      }else{localStorage.setItem(STORAGE_KEY,JSON.stringify(args.payload));status.textContent='✓ Progress saved in this browser';}
    }catch(err){status.textContent='Use a backup to keep your progress';if(storageBoot!==args.boot+'-error'){storageBoot=args.boot+'-error';value({kind:'storage_error'});}}
  }
  function render(){
    const signature=JSON.stringify({mode:args.mode,payload:args.payload,restore:args.restore,boot:args.boot,narrow:window.innerWidth<540});
    if(signature===lastSignature)return;lastSignature=signature;root.replaceChildren();group=null;
    if(args.mode==='storage')storage();else if(args.mode==='resources')resourceMap();else if(args.mode==='topics')topicMap();else if(args.mode==='week')weekMap();else if(args.mode==='progress')progressMap();
    height();requestAnimationFrame(height);
  }
  window.addEventListener('message',e=>{if(e.source!==window.parent||!e.data||e.data.type!=='streamlit:render')return;args=e.data.args||{};render();});
  let resizeTimer,knownWidth=window.innerWidth;
  window.addEventListener('resize',()=>{if(window.innerWidth===knownWidth)return;knownWidth=window.innerWidth;clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{lastSignature='';render();},100);});
  new ResizeObserver(()=>requestAnimationFrame(height)).observe(root);
  post('streamlit:componentReady',{apiVersion:1});
})();
</script></body></html>
