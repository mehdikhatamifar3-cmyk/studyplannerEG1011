67b}.check-options{border:0;padding:0;margin:10px 0 14px}.answer-option{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.6;padding:10px;border:1px solid #dce7ec;border-radius:9px;margin:6px 0;cursor:pointer}.answer-option:has(input:checked){border-color:#146f78;background:#edf7f5}.answer-option input{margin-top:4px;accent-color:#146f78}.panel-body .feedback{padding:11px;background:#fff7e8;border-radius:10px;font-size:13px;margin-top:15px}.panel-body .feedback.correct{background:#eaf6f0;color:#24614a}
  @media(max-width:620px){.orbit-tools{gap:5px}.orbit-tools .next-chip{order:5;margin-left:0;max-width:100%;flex-basis:100%;text-align:left}.orbit-tools .gap-chip{font-size:11px}.detail-panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-width:none;max-height:72%;padding:22px 19px}.detail-panel h3{font-size:20px}.panel-body p{font-size:13px}}

  .material-symbol{flex:0 0 40px;width:40px;height:40px;border:1.8px solid var(--c);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--c);background:#fff;font-size:11px;font-weight:800;letter-spacing:.015em}.material-key-rows{display:grid;gap:0;margin:5px 0 12px}.material-key-row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #e7edf3}.material-key-row:last-child{border-bottom:0}.material-meaning{min-width:0}.material-meaning strong{display:block;font-size:13px;line-height:1.4;color:#223d55;margin:1px 0 4px}.material-meaning small{display:block;font-size:11px;line-height:1.6;color:#607589}.mobile-key{display:none}.key-button{font-size:12px!important;background:#fff}.weekly-material-key{margin:0 0 14px;border:1px solid #dce5ed;border-radius:12px;background:#fff}.weekly-material-key>summary{cursor:pointer;padding:12px 16px;font-size:12px;color:#2b485f;line-height:1.5}.weekly-material-key .key-title{font-weight:750;margin-right:16px}.weekly-material-key .key-hint{color:#60778c;font-size:11px}.weekly-material-key>.material-key-rows{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 25px;padding:0 18px 9px;margin:0}.weekly-material-key[open]>summary{border-bottom:1px solid #e6edf3;background:#fafcfe;border-radius:12px 12px 0 0}.weekly-material-key:focus-within{outline-offset:3px}.bubble{flex-shrink:0;cursor:help}
  @media(max-width:620px){.desktop-key{display:none}.mobile-key{display:inline}.key-button{min-width:39px;padding-left:9px;padding-right:9px}.weekly-material-key>.material-key-rows{grid-template-columns:1fr}.weekly-material-key .key-hint{display:none}.material-meaning strong{font-size:12px}}
  /* Glass surfaces preserve the existing positions and typography. */
  .stage{background:radial-gradient(ellipse at 44% 40%,#ffffffcf 0%,#f2f7fbd9 100%);box-shadow:inset 0 1px 0 #ffffffd9}
  .node-motion{transform-box:view-box;transition:transform 210ms cubic-bezier(.2,.7,.2,1)}
  .glass-face{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.84);background:linear-gradient(140deg,rgba(255,255,255,.88),rgba(255,255,255,.61));backdrop-filter:blur(11px) saturate(1.12);-webkit-backdrop-filter:blur(11px) saturate(1.12);box-shadow:inset 0 1px 2px #ffffffed,inset 0 -1px 2px #bfd0df22;pointer-events:none}
  .glass-shadow{transition:opacity 210ms ease}
  .node .halo{transition:stroke-opacity 200ms ease,stroke-width 200ms ease}
  .node.is-hot>.node-motion{transform:translateY(-4px) scale(1.035)}

  .node.is-hot>.glass-shadow{opacity:.13}
  .node.is-selected>.glass-shadow{opacity:.105}
  .node.is-hot .halo,.node.is-selected .halo{stroke-opacity:.24;stroke-width:8}

  svg .node:hover circle.main{stroke-width:3.2}
  svg .node:focus circle.main{stroke:var(--node-color,#276bb4)}
  svg .node:focus-visible circle.main{stroke-width:4.5}
  .connection{transition:stroke 180ms ease,opacity 180ms ease,stroke-width 180ms ease}
  .connection.is-linked{stroke:var(--link-color);stroke-width:3;opacity:.95}

  .connection-cue{box-shadow:0 0 0 3px #146f7810;transition:box-shadow 200ms ease}
  .detail-panel{background:rgba(255,255,255,.94);backdrop-filter:blur(18px) saturate(1.14);-webkit-backdrop-filter:blur(18px) saturate(1.14);box-shadow:inset 0 1px 0 #ffffffd9,0 18px 46px #17374c20}
  .detail-panel.panel-enter{animation:panel-open 190ms cubic-bezier(.2,.7,.2,1) both}
  .detail-panel.panel-closing{animation:panel-close 130ms ease-in both;pointer-events:none}
  .completion-mark{transform-box:fill-box;transform-origin:center;animation:completion-pop 820ms ease-out both}
  .completion-check{stroke-dasharray:24;stroke-dashoffset:24;animation:check-draw 260ms 90ms ease-out forwards}
  .completion-confirmed{animation:completion-feedback 500ms ease-out 1}
  .day,.weekly-material-key{background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 #ffffffd9,0 5px 18px #18384f05}
  .day{transition:transform 190ms ease,box-shadow 190ms ease}
  .day:hover,.day:focus-within{transform:translateY(-3px);box-shadow:inset 0 1px 0 #ffffffd9,0 10px 24px #18384f0d}
  .weekly-material-key[open]>.material-key-rows{animation:content-open 170ms ease-out 1}
  @keyframes connection-pass{0%{stroke-dashoffset:var(--travel);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{stroke-dashoffset:0;opacity:0}}
  @keyframes panel-open{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
  @keyframes panel-close{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(8px)}}
  @keyframes content-open{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
  @keyframes check-draw{to{stroke-dashoffset:0}}
  @keyframes completion-pop{0%{opacity:0;transform:scale(.72)}20%{opacity:1;transform:scale(1.12)}35%,78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
  @keyframes completion-feedback{0%,100%{box-shadow:none}40%{box-shadow:0 0 0 4px #28755e20}}
  @media(max-width:620px){.detail-panel.panel-enter{animation-name:panel-open-mobile}.detail-panel.panel-closing{animation-name:panel-close-mobile}}
  @keyframes panel-open-mobile{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes panel-close-mobile{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(8px)}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}.node-motion{transform:none!important}.connection-flow{display:none}.day:hover,.day:focus-within{transform:none}}

</style>

<body><div id="root"></div><div id="live" class="sr-only" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const root=document.getElementById('root'), live=document.getElementById('live');
  const NS='http://www.w3.org/2000/svg', STORAGE_KEY='eg1011.study-navigator.v2';
  let args={}, transform={x:0,y:0,k:1}, group=null, viewport=null, lastSignature='', storageBoot='', counter=0, layoutContext='', stageElement=null;
  const post=(type,data={})=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
  const value=data=>post('streamlit:setComponentValue',{value:{...data,event_id:Date.now()+'-'+(++counter)},dataType:'json'});
  // Measure content, not the iframe viewport: viewport-based height can grow
  // by a few pixels on every resize and create a feedback loop.
  const height=()=>post('streamlit:setFrameHeight',{height:Math.ceil(root.getBoundingClientRect().height)+2});
  const el=(tag,attrs={},text)=>{const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));if(text!==undefined)n.textContent=text;return n;};
  const html=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
  const motionAllowed=()=>!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let hotResource=null, completionSeen=false, lastCompletionNotice=null, justCompleted=new Set();
  function glassNode(node,x,y,r,color,{width=2,dashed=false}={}){
    node.style.setProperty('--node-color',color);
    node.dataset.cx=x;node.dataset.cy=y;node.dataset.radius=r;
    // The fixed hit area prevents hover flicker while the visible face lifts.
    node.appendChild(el('circle',{class:'node-hit',cx:x,cy:y,r:r+10,fill:'transparent',stroke:'none','pointer-events':'all'}));
    node.appendChild(el('circle',{class:'glass-shadow',cx:x,cy:y+7,r:r-1,fill:'#173c53',opacity:.075,filter:'url(#glass-shadow)','pointer-events':'none'}));
    const face=el('g',{class:'node-motion'});face.style.transformOrigin=`${x}px ${y}px`;node.appendChild(face);
    face.appendChild(el('circle',{class:'halo',cx:x,cy:y,r:r+7,fill:'none',stroke:color,'stroke-opacity':.055,'stroke-width':7,'pointer-events':'none'}));
    const pane=el('foreignObject',{x:x-r,y:y-r,width:2*r,height:2*r,'pointer-events':'none','aria-hidden':'true'});
    const frost=document.createElementNS('http://www.w3.org/1999/xhtml','div');frost.setAttribute('class','glass-face');pane.appendChild(frost);face.appendChild(pane);
    face.appendChild(el('circle',{class:'main',cx:x,cy:y,r,fill:'#fff','fill-opacity':.025,stroke:color,'stroke-width':width,'stroke-dasharray':dashed?'4 5':'none'}));
    face.appendChild(el('circle',{class:'glass-rim',cx:x,cy:y,r:r-2,fill:'none',stroke:'#fff','stroke-opacity':.7,'stroke-width':1,'pointer-events':'none'}));
    return face;
  }
  function traceConnections(paths){
    if(!motionAllowed()||!group)return;
    paths.forEach(path=>{
      const length=path.getTotalLength();if(!Number.isFinite(length)||length<1)return;
      const flash=el('path',{class:'connection-flow',d:path.getAttribute('d'),fill:'none',stroke:path.style.getPropertyValue('--link-color')||'#146f78','stroke-width':3,'stroke-linecap':'round','pointer-events':'none'});
      flash.style.setProperty('--travel',String(length));flash.style.strokeDasharray=`12 ${length+12}`;flash.style.strokeDashoffset=String(length);
      group.appendChild(flash);setTimeout(()=>flash.remove(),760);
    });
  }
  function paintOrbit(animate=false){
    if(args.mode!=='resources'||!group)return;
    const p=args.payload,id=hotResource||(orbitPanel?.kind==='resource'?orbitPanel.id:['topic','check','prerequisites'].includes(orbitPanel?.kind)?'_topic':null);
    const index=p.plan.findIndex(b=>b.id===id),before=index>0?p.plan[index-1].id:null;
    const after=index>=0&&index<p.plan.length-1?p.plan[index+1].id:(p.next?.topic_id===p.topic.id&&p.next.id!==id?p.next.id:null);
    const colour=p.resources.find(r=>r.id===id)?.color||'#146f78';
    root.querySelectorAll('.node').forEach(node=>{
      node.classList.toggle('is-hot',node.dataset.id===hotResource);
      node.classList.toggle('is-selected',node.dataset.id===id);
      node.classList.toggle('is-prerequisite',node.dataset.id===before);
      node.classList.toggle('is-next',Boolean(id)&&node.dataset.id===after);
    });
    root.querySelector('.gap-chip')?.classList.toggle('connection-cue',Boolean(id)&&p.gaps.length>0);
    root.querySelector('.next-chip')?.classList.toggle('connection-cue',Boolean(id));
    const linked=[];
    root.querySelectorAll('.connection').forEach(path=>{
      const related=Boolean(id)&&(id==='_topic'?path.dataset.kind==='support':path.dataset.from===id||path.dataset.to===id);
      path.classList.toggle('is-linked',related);path.style.setProperty('--link-color',colour);if(related)linked.push(path);
    });
    if(animate)traceConnections(linked);
  }
  function bindOrbit(node,id){
    node.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch'){hotResource=id;paintOrbit();}});
    node.addEventListener('pointerleave',()=>{hotResource=null;paintOrbit();});
    node.addEventListener('focus',()=>{hotResource=id;paintOrbit();});
    node.addEventListener('blur',()=>{hotResource=null;paintOrbit();});
  }
  function paintTopic(id,animate=false){
    if(args.mode!=='topics'||!group)return;
    const p=args.payload,ancestors=new Set(),links=new Set(),children=new Set();
    function visit(target){
      p.edges.filter(e=>!e.helpful&&e.to===target).forEach(e=>{
        links.add(e.from+'|'+e.to);if(!ancestors.has(e.from)){ancestors.add(e.from);visit(e.from);}
      });
    }
    visit(id);p.edges.filter(e=>!e.helpful&&e.from===id).forEach(e=>{children.add(e.to);links.add(e.from+'|'+e.to);});
    const colour=root.querySelector(`.node[data-id="${id}"]`)?.style.getPropertyValue('--node-color')||'#146f78',paths=[];
    root.querySelectorAll('.node').forEach(node=>{
      node.classList.toggle('is-selected',node.dataset.id===id);node.classList.toggle('is-prerequisite',ancestors.has(node.dataset.id));node.classList.toggle('is-next',children.has(node.dataset.id));
    });
    root.querySelectorAll('.connection').forEach(path=>{
      const linked=links.has(path.dataset.from+'|'+path.dataset.to);path.classList.toggle('is-linked',linked);path.style.setProperty('--link-color',colour);if(linked)paths.push(path);
    });
    if(animate)traceConnections(paths);
  }
  function bindTopic(node,id){
    const restore=()=>paintTopic(args.payload.nodes.find(n=>n.role==='focus')?.id||id);
    node.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch'){node.classList.add('is-hot');paintTopic(id);}});
    node.addEventListener('pointerleave',()=>{node.classList.remove('is-hot');restore();});
    node.addEventListener('focus',()=>{node.classList.add('is-hot');paintTopic(id);});
    node.addEventListener('blur',()=>{node.classList.remove('is-hot');restore();});
  }
  function celebrateCompletion(face,pos,title){
    if(!motionAllowed())return;
    const x=pos.x+pos.r*.72,y=pos.y-pos.r*.72;
    const badge=el('g',{class:'completion-mark','aria-hidden':'true'});
    badge.appendChild(el('circle',{cx:x,cy:y,r:16,fill:'#28755E',stroke:'#fff','stroke-width':2}));
    badge.appendChild(el('path',{class:'completion-check',d:`M ${x-7} ${y} L ${x-2} ${y+5} L ${x+7} ${y-6}`,fill:'none',stroke:'#fff','stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round'}));
    face.appendChild(badge);live.textContent=title+' completed';setTimeout(()=>badge.remove(),950);
  }
  function label(parent,text,x,y,{size=14,fill='#20364d',weight=600,max=17,lineHeight=18}={}){
    let words=String(text).split(/\s+/),lines=[],line='';
    for(const word of words){if(line && (line+' '+word).length>max){lines.push(line);line=word;}else line=line?line+' '+word:word;}if(line)lines.push(line);
    const t=el('text',{x,y:y-(lines.length-1)*lineHeight/2,'text-anchor':'middle',fill,'font-size':size,'font-weight':weight});
    lines.forEach((s,i)=>t.appendChild(el('tspan',{x,dy:i?lineHeight:0},s)));parent.appendChild(t);return t;
  }
  function eventNode(node,kind,id,description,onChoose=null){
    node.setAttribute('tabindex','0');node.setAttribute('role','button');node.setAttribute('aria-label',description);
    node.appendChild(el('title',{},description));
    const choose=()=>{live.textContent=description;if(onChoose)onChoose();else value({kind,id});};
    node.addEventListener('click',choose);node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}});
  }
  function edge(parent,a,b,{color='#7393a7',dashed=false,width=2,curve=0,opacity=1}={}){
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
    const start={x:a.x+dx/d*(a.r+5),y:a.y+dy/d*(a.r+5)},end={x:b.x-dx/d*(b.r+9),y:b.y-dy/d*(b.r+9)};
    let path=curve?`M ${start.x} ${start.y} Q ${(a.x+b.x)/2-dy/d*curve} ${(a.y+b.y)/2+dx/d*curve} ${end.x} ${end.y}`:`M ${start.x} ${start.y} L ${end.x} ${end.y}`;
    const line=el('path',{class:'connection',d:path,fill:'none',stroke:color,'stroke-width':width,'stroke-dasharray':dashed?'5 6':'none','marker-end':'url(#arrow)',opacity});parent.appendChild(line);return line;
  }
  function apply(){if(group)group.setAttribute('transform',`translate(${transform.x} ${transform.y}) scale(${transform.k})`);}
  function canvas(width,chartHeight,viewHeight,title){
    const toolbar=html('div','toolbar');
    [['−','Zoom out',.8],['+','Zoom in',1.25],['Fit','Fit map',0]].forEach(([text,aria,k])=>{
      const button=html('button','',text);button.setAttribute('aria-label',aria);button.addEventListener('click',()=>{
        if(!k)transform={x:0,y:0,k:1};else{const next=Math.max(.55,Math.min(2.8,transform.k*k)),ratio=next/transform.k;transform={x:width/2-(width/2-transform.x)*ratio,y:viewHeight/2-(viewHeight/2-transform.y)*ratio,k:next};}apply();});toolbar.appendChild(button);

  function topicMap(){
    const p=args.payload,nodes=p.nodes,all=p.scope==='all',layers=new Map();
