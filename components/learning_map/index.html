<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EG1011 interactive learning map</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:transparent;color:#20364d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:14px}
  button{font:inherit;cursor:pointer;color:#28415b;background:white;border:1px solid #d8e3ec;border-radius:9px;padding:7px 12px;min-height:36px}button:hover{background:#edf4f8}button:focus-visible,[role=button]:focus-visible{outline:3px solid #276bb4;outline-offset:4px}
  .toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:3px 4px 10px}.toolbar .hint{margin-left:auto;font-size:12px;color:#52677c}.stage{border:1px solid #dce5ed;border-radius:20px;background:radial-gradient(ellipse at 50% 50%,#fff 30%,#f2f7fa 100%);overflow:hidden;position:relative;touch-action:pan-y}
  svg{display:block;width:100%;height:100%}svg text{pointer-events:none;user-select:none}svg .node{cursor:pointer}svg .node circle.main{transition:stroke-width .15s,fill-opacity .15s}svg .node:hover circle.main{stroke-width:4;fill-opacity:.18}svg .node:focus{outline:none}svg .node:focus circle.main{stroke-width:5;stroke:#276bb4}
  .legend{display:flex;justify-content:center;gap:8px 15px;flex-wrap:wrap;padding:12px 2px 4px;font-size:12px;color:#41586b}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.note{font-size:12px;line-height:1.5;color:#54687b;margin:8px 2px 0}.storage{font-size:11px;color:#4f6577;padding:1px 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .week{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.day{background:#fff;border:1px solid #dce5ed;border-radius:17px;padding:15px}.day h3{font-size:15px;margin:0 0 4px}.day .total{color:#5d7081;font-size:12px;margin-bottom:15px}.block{position:relative;display:grid;grid-template-columns:32px 1fr;gap:10px;margin-bottom:13px}.block:before{content:'';position:absolute;top:24px;bottom:-12px;left:15px;width:2px;background:#e2e9ef}.block:last-child:before{display:none}.bubble{z-index:1;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2px solid var(--c);background:#fff;color:var(--c);font-size:10px;font-weight:800}.block button{text-align:left;padding:0;border:0;min-height:32px;background:transparent;line-height:1.4}.block strong{display:block;font-size:12px}.block small{display:block;font-size:11px;color:#53697c}.empty{padding:28px;border-radius:14px;background:#f4f7fa;text-align:center}

  .orbit-tools{gap:7px;padding:0 2px 10px}.orbit-tools .next-chip{margin-left:10px;color:#21685f;border-color:#c3ddd6;background:#edf7f3;max-width:600px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:650}.orbit-tools .gap-chip{color:#80612e;background:#fffaf1;border-color:#e8dcc6;margin-left:auto;font-size:12px}.orbit-tools button{font-size:13px}
  .detail-panel{--accent:#087f8c;position:absolute;top:16px;bottom:auto;right:16px;width:350px;max-height:calc(100% - 32px);max-width:calc(100% - 24px);overflow:hidden;display:flex;flex-direction:column;background:#fffffffa;border:1px solid #d6e4ec;border-top:4px solid var(--accent);border-radius:16px;padding:25px 22px;box-shadow:0 15px 55px #15334b25;z-index:4;overscroll-behavior:contain}.panel-close{position:absolute;right:10px;top:9px;min-height:28px;width:28px;padding:0;font-size:24px;line-height:25px;border:0;background:transparent;color:#5c7284}.panel-body{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}.panel-kicker{flex-shrink:0;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:750;color:var(--accent);padding-right:16px;margin-bottom:8px}.detail-panel h3{flex-shrink:0;font-size:21px;line-height:1.25;letter-spacing:-.025em;margin:0 12px 17px 0;color:#193a52;outline:none}.panel-body p{font-size:14px;line-height:1.65;margin:0 0 14px;color:#3b566e}.panel-body p.small{font-size:11px;line-height:1.6;color:#657b8d}.panel-actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}.panel-actions button,.panel-body>button{font-size:13px;line-height:1.4;min-height:40px}.panel-body button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}.resource-link{font-size:13px;color:#087f8c;text-decoration:none;padding:10px 0}.practice-prompt{background:#eef5f7;border-radius:9px;padding:12px;font-size:13px;color:#31576c}.practice-prompt p{margin:5px 0 0;font-size:13px}.panel-why{margin:12px 0;color:#526b7e;font-size:12px}.panel-why summary{cursor:pointer}.panel-why p{margin:8px 0!important}.gap-list{display:flex;gap:6px;flex-wrap:wrap}.gap-list button{font-size:11px;padding:5px 8px;min-height:31px}.outcome-tags{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 15px}.outcome-tags span{font-size:10px;padding:5px 8px;border-radius:20px;background:#edf3f7;color:#49667b}.check-options{border:0;padding:0;margin:10px 0 14px}.answer-option{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.6;padding:10px;border:1px solid #dce7ec;border-radius:9px;margin:6px 0;cursor:pointer}.answer-option:has(input:checked){border-color:#087f8c;background:#edf7f5}.answer-option input{margin-top:4px;accent-color:#087f8c}.panel-body .feedback{padding:11px;background:#fff7e8;border-radius:10px;font-size:13px;margin-top:15px}.panel-body .feedback.correct{background:#eaf6f0;color:#24614a}
  @media(max-width:620px){.orbit-tools{gap:5px}.orbit-tools .next-chip{order:5;margin-left:0;max-width:100%;flex-basis:100%;text-align:left}.orbit-tools .gap-chip{font-size:11px}.detail-panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-width:none;max-height:72%;padding:22px 19px}.detail-panel h3{font-size:20px}.panel-body p{font-size:13px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><div id="root"></div><div id="live" class="sr-only" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const root=document.getElementById('root'), live=document.getElementById('live');
  const NS='http://www.w3.org/2000/svg', STORAGE_KEY='eg1011.study-navigator.v2';
  let args={}, transform={x:0,y:0,k:1}, group=null, viewport=null, lastSignature='', storageBoot='', counter=0, layoutContext='', stageElement=null;
  const post=(type,data={})=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
  const value=data=>post('streamlit:setComponentValue',{value:{...data,event_id:Date.now()+'-'+(++counter)},dataType:'json'});
  // Measure content, not the iframe viewport: viewport-based height can grow
  // by a few pixels on every resize and create a feedback loop.
  const height=()=>post('streamlit:setFrameHeight',{height:Math.ceil(root.getBoundingClientRect().height)+2});
  const el=(tag,attrs={},text)=>{const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));if(text!==undefined)n.textContent=text;return n;};
  const html=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
  function label(parent,text,x,y,{size=14,fill='#20364d',weight=600,max=17,lineHeight=18}={}){
    let words=String(text).split(/\s+/),lines=[],line='';
    for(const word of words){if(line && (line+' '+word).length>max){lines.push(line);line=word;}else line=line?line+' '+word:word;}if(line)lines.push(line);
    const t=el('text',{x,y:y-(lines.length-1)*lineHeight/2,'text-anchor':'middle',fill,'font-size':size,'font-weight':weight});
    lines.forEach((s,i)=>t.appendChild(el('tspan',{x,dy:i?lineHeight:0},s)));parent.appendChild(t);return t;
  }
  function eventNode(node,kind,id,description,onChoose=null){
    node.setAttribute('tabindex','0');node.setAttribute('role','button');node.setAttribute('aria-label',description);
    node.appendChild(el('title',{},description));
    const choose=()=>{live.textContent=description;if(onChoose)onChoose();else value({kind,id});};
    node.addEventListener('click',choose);node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}});
  }
  function edge(parent,a,b,{color='#7393a7',dashed=false,width=2,curve=0,opacity=1}={}){
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
    const start={x:a.x+dx/d*(a.r+5),y:a.y+dy/d*(a.r+5)},end={x:b.x-dx/d*(b.r+9),y:b.y-dy/d*(b.r+9)};
    let path=curve?`M ${start.x} ${start.y} Q ${(a.x+b.x)/2-dy/d*curve} ${(a.y+b.y)/2+dx/d*curve} ${end.x} ${end.y}`:`M ${start.x} ${start.y} L ${end.x} ${end.y}`;
    parent.appendChild(el('path',{d:path,fill:'none',stroke:color,'stroke-width':width,'stroke-dasharray':dashed?'5 6':'none','marker-end':'url(#arrow)',opacity}));
  }
  function apply(){if(group)group.setAttribute('transform',`translate(${transform.x} ${transform.y}) scale(${transform.k})`);}
  function canvas(width,chartHeight,viewHeight,title){
    const toolbar=html('div','toolbar');
    [['−','Zoom out',.8],['+','Zoom in',1.25],['Fit','Fit map',0]].forEach(([text,aria,k])=>{
      const button=html('button','',text);button.setAttribute('aria-label',aria);button.addEventListener('click',()=>{
        if(!k)transform={x:0,y:0,k:1};else{const next=Math.max(.55,Math.min(2.8,transform.k*k)),ratio=next/transform.k;transform={x:width/2-(width/2-transform.x)*ratio,y:viewHeight/2-(viewHeight/2-transform.y)*ratio,k:next};}apply();});toolbar.appendChild(button);
    });
    toolbar.appendChild(html('span','hint','Click a circle · Tab + Enter also works'));
    root.appendChild(toolbar);const stage=html('div','stage');stageElement=stage;stage.style.height=chartHeight+'px';
    const svg=el('svg',{viewBox:`0 0 ${width} ${viewHeight}`,role:'group','aria-label':title});viewport=svg;
    const defs=el('defs');const marker=el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:5,markerHeight:5,orient:'auto-start-reverse'});marker.appendChild(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7393a7'}));defs.appendChild(marker);svg.appendChild(defs);
    group=el('g');svg.appendChild(group);stage.appendChild(svg);root.appendChild(stage);apply();
    let drag=null;
    svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;if(e.pointerType==='touch')return;drag={x:e.clientX,y:e.clientY,tx:transform.x,ty:transform.y};svg.setPointerCapture(e.pointerId);});
    svg.addEventListener('pointermove',e=>{if(!drag)return;const scale=width/svg.getBoundingClientRect().width;transform.x=drag.tx+(e.clientX-drag.x)*scale;transform.y=drag.ty+(e.clientY-drag.y)*scale;apply();});
    svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);
    return group;
  }
  // Panels live within the orbit, so inspecting a material never scrolls or
  // reruns the page. Only progress/check actions need a Python round-trip.
  let orbitPanel=null, panelTopic='', nativeResource=null;
  function actionButton(text, action, primary=false){
    const button=html('button',primary?'primary':'',text);button.type='button';button.addEventListener('click',action);return button;
  }
  function openOrbitPanel(kind,id=null){orbitPanel={kind,id};renderOrbitPanel(true);}
  function closeOrbitPanel(){
    const old=orbitPanel;orbitPanel=null;stageElement?.querySelector('.detail-panel')?.remove();
    root.querySelectorAll('.node .halo').forEach(n=>n.setAttribute('stroke-opacity','.06'));
    const id=old?.kind==='resource'?old.id:'_topic';root.querySelector(`.node[data-id="${id}"]`)?.focus({preventScroll:true});
  }
  function renderOrbitPanel(focus=false){
    if(!stageElement||args.mode!=='resources')return;
    stageElement.querySelector('.detail-panel')?.remove();
    root.querySelectorAll('.node .halo').forEach(n=>n.setAttribute('stroke-opacity','.06'));
    if(!orbitPanel)return;
    const p=args.payload,panel=html('section','detail-panel');
    panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','false');panel.setAttribute('aria-labelledby','orbit-panel-title');
    const close=actionButton('×',closeOrbitPanel);close.className='panel-close';close.setAttribute('aria-label','Close details');panel.appendChild(close);
    const kicker=html('div','panel-kicker'),title=html('h3',''),body=html('div','panel-body');title.id='orbit-panel-title';title.tabIndex=-1;
    panel.append(kicker,title,body);
    const paragraph=(text,cls='')=>body.appendChild(html('p',cls,text));
    const actions=()=>{const row=html('div','panel-actions');body.appendChild(row);return row;};
    const jump=view=>value({kind:'view',id:view});
    const noteSource=()=>paragraph('Lecture notes: '+p.source,'small');
    if(orbitPanel.kind==='resource'){
      const resource=p.resources.find(r=>r.id===orbitPanel.id);if(!resource){orbitPanel=null;return;}
      const block=p.plan.find(b=>b.id===resource.id),done=p.completed.includes(resource.id);
      panel.style.setProperty('--accent',resource.color);kicker.textContent=block?`Step ${block.step} · ${block.minutes} min`:'Optional support';title.textContent=resource.title;
      const circle=root.querySelector(`.node[data-id="${resource.id}"] .halo`);circle?.setAttribute('stroke-opacity','.6');
      paragraph(block?.guidance||resource.guidance);
      if(resource.id==='LN'){paragraph(p.topic.practice_prompt,'practice-prompt');noteSource();}
      if(block){const why=html('details','panel-why'),summary=html('summary','', 'Why this material?');why.append(summary,html('p','small',block.reason));body.appendChild(why);}
      const row=actions();
      row.appendChild(actionButton(done?'✓ Completed — undo':'Mark activity complete',()=>value({kind:'complete_activity',key:block?.key||`${p.topic.id}|${resource.id}|practice`,completed:!done}),!done));
      if(resource.url){const link=html('a','resource-link','Open material ↗');link.href=resource.url;link.target='_blank';link.rel='noopener noreferrer';row.appendChild(link);}
      else paragraph('Open the topic-matched material on the EG1011 course site.','small');
      paragraph('Activity completion is separate from solving a problem independently.','small');
    }else if(orbitPanel.kind==='prerequisites'){
      kicker.textContent='Build on earlier knowledge';title.textContent=p.gaps.length?'Check your building blocks':'Ready to begin';
      const first=p.next&&p.next.topic_id!==p.topic.id?p.next:null;
      if(first){paragraph(first.reason);paragraph(`${first.topic_title} · ${first.minutes} min`,'practice-prompt');const row=actions();row.appendChild(actionButton('Practise this building block',()=>value({kind:'topic',id:first.topic_id,view:'My pathway'}),true));row.appendChild(actionButton('Mark prerequisite review complete',()=>value({kind:'complete_activity',key:first.key,completed:true})));}
      if(p.gaps.length){
        paragraph('Unchecked does not mean failed. A short review addresses one gap; check the remaining connections as you practise.','small');
        const list=html('div','gap-list');p.gaps.forEach(t=>list.appendChild(actionButton((t.level===0?'? ':'↻ ')+t.short_title,()=>value({kind:'topic',id:t.id,view:'My pathway'}))));body.appendChild(list);
      }else paragraph('Your saved prerequisite ratings suggest you can start. Revisit a building block if a problem reveals a gap.');
      actions().appendChild(actionButton('See the learning chain',()=>jump('Topic connections')));
    }else if(orbitPanel.kind==='check'){
      kicker.textContent='Try with notes closed';title.textContent='Check your understanding';
      const check=p.topic.check;paragraph(check.question);
      const field=html('fieldset','check-options'),legend=html('legend','sr-only','Choose one answer');field.appendChild(legend);
      let selected=null;
      const submit=actionButton('Check my reasoning',()=>{if(selected!==null)value({kind:'concept_check',topic_id:p.topic.id,answer:selected});},true);submit.disabled=true;
      check.options.forEach((text,i)=>{
        const label=html('label','answer-option'),input=document.createElement('input');input.type='radio';input.name='orbit-check';input.value=String(i);
        input.addEventListener('change',()=>{selected=i;submit.disabled=false;});label.append(input,document.createTextNode(text));field.appendChild(label);
      });body.append(field,submit);
      if(p.check_result){
        const message=html('p',p.check_result.correct?'feedback correct':'feedback', (p.check_result.correct?'Correct. ':'Revisit this idea. ')+check.explanation);message.setAttribute('role','status');body.appendChild(message);
        if(!p.check_result.correct&&check.repair_topic!==p.topic.id)actions().appendChild(actionButton('Reconnect: '+p.repair_title,()=>value({kind:'topic',id:check.repair_topic,view:'My pathway'})));
      }
      paragraph('This checks one idea. A correct answer does not automatically change your topic rating.','small');
    }else if(orbitPanel.kind==='guide'){
      kicker.textContent='How to use the orbit';title.textContent='Click, practise, reflect';
      paragraph('Follow the numbered circles for today’s sequence. Solid outlines show planned activities; dashed outlines offer extra support.');
      paragraph('Click any material for its instructions and completion button. Click the centre for topic notes and a short concept check.');
      paragraph('The overlapping zones connect understanding, practice and reflection. Zoom with + or −; Fit restores the view.','small');
      actions().appendChild(actionButton('See prerequisite connections',()=>jump('Topic connections')));
    }else{
      kicker.textContent=p.topic.area+(p.topic.session?' · Session '+p.topic.session:' · Foundations');title.textContent=p.topic.title;
      paragraph(p.topic.description);
      const outcomes=html('div','outcome-tags');p.topic.outcomes.forEach(text=>outcomes.appendChild(html('span','',text)));body.appendChild(outcomes);noteSource();
      const mistake=html('div','practice-prompt');mistake.append(html('strong','','Watch for this'),html('p','',p.topic.common_mistake));body.appendChild(mistake);
      const row=actions();row.appendChild(actionButton('Try a concept check',()=>openOrbitPanel('check'),true));
      row.appendChild(actionButton('Check prerequisites'+(p.gaps.length?' ('+p.gaps.length+')':''),()=>openOrbitPanel('prerequisites')));
      row.appendChild(actionButton('Rate my skill / view progress',()=>jump('My progress')));
    }
    stageElement.appendChild(panel);if(focus)title.focus({preventScroll:true});
  }
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&orbitPanel){e.preventDefault();closeOrbitPanel();}});
  function resourceMap(){
    const narrow=window.innerWidth<620,p=args.payload,resources=p.resources,small=resources.length<4;
    if(panelTopic!==p.topic.id){panelTopic=p.topic.id;orbitPanel=null;nativeResource=p.selected_resource;transform={x:0,y:0,k:1};}
    else if(nativeResource!==p.selected_resource){nativeResource=p.selected_resource;orbitPanel={kind:'resource',id:p.selected_resource};}
    const width=narrow?440:1100,vh=narrow?(small?510:910):675;
    const chartHeight=narrow?Math.round(window.innerWidth*(small?1.2:1.95)):Math.max(540,Math.min(690,window.innerWidth*.54));
    const g=canvas(width,chartHeight,vh,'Your learning orbit — click a material or the centre for details');
    stageElement.classList.add('orbit-stage');
    const toolbar=root.querySelector('.toolbar');toolbar.classList.add('orbit-tools');toolbar.querySelector('.hint')?.remove();
    const next=p.next,chip=actionButton(next?`Next · ${next.title} · ${next.minutes} min`:'✓ Pathway complete',()=>next&&next.topic_id!==p.topic.id?openOrbitPanel('prerequisites'):next?openOrbitPanel('resource',next.id):openOrbitPanel('topic'));
    chip.className='next-chip';toolbar.appendChild(chip);
    if(p.gaps.length){const gaps=actionButton(p.gaps.length+' building blocks',()=>openOrbitPanel('prerequisites'));gaps.className='gap-chip';toolbar.appendChild(gaps);}
    const help=actionButton('?',()=>openOrbitPanel('guide'));help.setAttribute('aria-label','How to use the orbit');toolbar.appendChild(help);
    const cx=width/2,cy=narrow?(small?285:440):337;
    const zones=narrow?[[170,cy-65,150,'#087F8C'],[270,cy+10,150,'#397DB5'],[220,cy+95,120,'#37856A']]:[[cx-130,cy-35,238,'#087F8C'],[cx+130,cy-35,238,'#397DB5'],[cx,cy+110,186,'#37856A']];
    zones.forEach(([x,y,r,c])=>g.appendChild(el('circle',{cx:x,cy:y,r,fill:c,'fill-opacity':.035,stroke:c,'stroke-opacity':.12,'stroke-width':1.5})));
    let ids=p.plan.map(b=>b.id);ids=[...new Set([...ids,...resources.map(a=>a.id)])];
    const mobilePositions=[[110,95],[330,95],[330,270],[330,625],[330,810],[110,810],[110,625],[110,270]],positions={};
    ids.forEach((id,i)=>{const angle=-Math.PI/2+i*2*Math.PI/ids.length;const [x,y]=narrow?mobilePositions[i]:[cx+410*Math.cos(angle),cy+235*Math.sin(angle)];positions[id]={x,y,r:narrow?65:82};});
    for(let i=1;i<p.plan.length;i++)edge(g,positions[p.plan[i-1].id],positions[p.plan[i].id],{color:'#608e9b',width:2.5,curve:narrow?0:22});
    resources.filter(a=>!p.plan.some(b=>b.id===a.id)).forEach(a=>edge(g,positions[a.id],{x:cx,y:cy,r:narrow?79:108},{dashed:true,opacity:.35,width:1}));
    const centre=el('g',{class:'node topic-centre','data-id':'_topic'});
    centre.appendChild(el('circle',{class:'main',cx,cy,r:narrow?79:108,fill:'#fff',stroke:'#cddfe9','stroke-width':2}));
    label(centre,p.topic.short_title,cx,cy-14,{max:17,size:narrow?17:22,weight:750,lineHeight:narrow?20:26});
    label(centre,'Topic & concept check',cx,cy+(narrow?41:50),{size:narrow?9:12,fill:'#61758a',weight:500,max:30});
    eventNode(centre,'topic_info',p.topic.id,'About '+p.topic.title+'. Open topic details and concept check.',()=>openOrbitPanel('topic'));g.appendChild(centre);
    ids.forEach(id=>{
      const a=resources.find(r=>r.id===id),pos=positions[id],block=p.plan.find(b=>b.id===id),done=p.completed.includes(id);
      const node=el('g',{class:'node','data-id':id});
      node.appendChild(el('circle',{class:'halo',cx:pos.x,cy:pos.y,r:pos.r+7,fill:'none',stroke:a.color,'stroke-opacity':.06,'stroke-width':7}));
      node.appendChild(el('circle',{class:'main',cx:pos.x,cy:pos.y,r:pos.r,fill:'#fff',stroke:a.color,'stroke-width':block?2.8:1.5,'stroke-dasharray':block?'none':'4 5'}));
      node.appendChild(el('circle',{cx:pos.x,cy:pos.y,r:pos.r-2,fill:a.color,'fill-opacity':block?.085:.025}));
      label(node,a.short_title,pos.x,pos.y-10,{size:narrow?16:21,max:12,fill:'#20364d',weight:block?750:550,lineHeight:narrow?18:25});
      label(node,done?'✓ Completed':block?block.minutes+' min':'Support',pos.x,pos.y+(narrow?33:42),{size:narrow?12:14,max:25,fill:done?'#287352':a.color,weight:650});
      if(block){node.appendChild(el('circle',{cx:pos.x+pos.r*.72,cy:pos.y-pos.r*.72,r:narrow?14:16,fill:a.color,stroke:'white','stroke-width':2}));label(node,String(block.step),pos.x+pos.r*.72,pos.y-pos.r*.72+5,{size:narrow?11:13,fill:'white',max:3});}
      eventNode(node,'resource',id,a.title+(block?`, step ${block.step}, ${block.minutes} minutes`:', optional support')+'. Open instructions.',()=>openOrbitPanel('resource',id));g.appendChild(node);
    });
    renderOrbitPanel(Boolean(orbitPanel));
  }
  function topicMap(){
    const p=args.payload,nodes=p.nodes,all=p.scope==='all',layers=new Map();
    if(all){
      const memo={};const rank=id=>{if(id in memo)return memo[id];const n=nodes.find(n=>n.id===id);return memo[id]=Math.max(0,...p.edges.filter(e=>e.to===id&&!e.helpful).map(e=>rank(e.from)+1));};
      nodes.forEach(n=>{n.rank=rank(n.id);});
    }
    nodes.forEach(n=>{const rank=all?n.rank:n.column;const list=layers.get(rank)||[];list.push(n);layers.set(rank,list);});
    const keys=[...layers.keys()].sort((a,b)=>a-b),maxRows=Math.max(1,...[...layers.values()].map(a=>a.length));
    const columns=keys.map(k=>Math.ceil(layers.get(k).length/4));
    const width=Math.max(780,columns.reduce((a,b)=>a+b,0)*145+65),vh=Math.max(450,Math.min(4,maxRows)*125+100);
    const g=canvas(width,all?580:Math.min(600,Math.max(400,vh*.85)),vh,'Topic prerequisite connections');
    const positions={};
    let colOffset=0;const totalColumns=columns.reduce((a,b)=>a+b,0),columnGap=(width-170)/Math.max(totalColumns-1,1);
    keys.forEach((rank,index)=>{
      const list=layers.get(rank),x=85+colOffset*columnGap,cols=columns[index];
      let caption=all?'Step '+(rank+1):rank===0?'YOUR FOCUS':rank>0?'BUILDS ON THIS':rank===-1?'DIRECT BUILDING BLOCKS':'EARLIER FOUNDATIONS';
      label(g,caption,x+(cols-1)*columnGap/2,25,{size:10,fill:'#61758a',max:25,weight:700});
      list.forEach((n,i)=>{const col=Math.floor(i/4),rows=Math.min(4,list.length-col*4);positions[n.id]={x:x+col*columnGap,y:75+(i%4+.5)*(vh-95)/rows,r:n.role==='focus'?58:47};});
      colOffset+=cols;
    });
    const context=p.scope+'|'+(nodes.find(n=>n.role==='focus')||{}).id+'|'+nodes.length+'|'+(window.innerWidth<540);
    if(context!==layoutContext){
      layoutContext=context;const focus=positions[(nodes.find(n=>n.role==='focus')||nodes[0]).id];
      const k=all||window.innerWidth<540?Math.min(2.8,Math.max(1,width/window.innerWidth)):1;
      transform=k>1?{k,x:width/2-focus.x*k,y:vh/2-focus.y*k}:{x:0,y:0,k:1};apply();
    }
    p.edges.forEach(e=>{if(positions[e.from]&&positions[e.to])edge(g,positions[e.from],positions[e.to],{dashed:e.helpful,opacity:e.helpful?.6:.8,width:e.helpful?1.5:2,curve:12});});
    const colors={Foundations:'#8B66AD',Statics:'#087F8C',Dynamics:'#C16A31'};
    nodes.forEach(n=>{
      const pos=positions[n.id],color=colors[n.area],node=el('g',{class:'node','data-id':n.id});
      node.appendChild(el('circle',{cx:pos.x,cy:pos.y,r:pos.r+8,fill:color,'fill-opacity':n.role==='focus'?.12:.04}));
      node.appendChild(el('circle',{class:'main',cx:pos.x,cy:pos.y,r:pos.r,fill:'#fff',stroke:color,'stroke-width':n.role==='focus'?3:2,'stroke-dasharray':n.level===0?'4 4':'none'}));
      label(node,n.short_title,pos.x,pos.y-6,{size:n.role==='focus'?13:11.5,max:15,lineHeight:15,weight:650});
      const symbol=['? Not checked','↻ Practise','◐ With help','✓ Independent'][n.level];
      label(node,symbol,pos.x,pos.y+29,{size:8.5,fill:'#526a7c',max:24});
      eventNode(node,'topic',n.id,n.title+'. '+symbol+'. '+n.area);g.appendChild(node);
    });
    const legend=html('div','legend');for(const [text,color] of Object.entries(colors)){const span=html('span'),dot=html('i','dot');dot.style.background=color;span.append(dot,document.createTextNode(text));legend.appendChild(span);}root.appendChild(legend);
    root.appendChild(html('p','note','Arrows point from earlier knowledge to the topic that uses it. Solid = required; dashed = helpful. A dashed circle means not checked. Use zoom or drag the background for a closer view.'));
  }
  function weekMap(){
    const week=html('div','week');
    for(const day of args.payload.days){
      const card=html('article','day'),when=new Date(day.date+'T12:00:00');
      card.appendChild(html('h3','',when.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'})));
      card.appendChild(html('div','total',day.minutes+' min planned'+(day.unused?' · '+day.unused+' min spare':'')));
      day.blocks.forEach(b=>{
        const row=html('div','block'),bubble=html('span','bubble',b.id);bubble.style.setProperty('--c',b.color);
        const button=html('button');button.appendChild(html('strong','',b.topic_title));button.appendChild(html('small','',b.title+' · '+b.minutes+' min'));
        button.setAttribute('aria-label','Explore '+b.topic_title);button.addEventListener('click',()=>value({kind:'topic',id:b.topic_id,view:'My pathway'}));row.append(bubble,button);card.appendChild(row);
      });week.appendChild(card);
    }root.appendChild(week);
    root.appendChild(html('p','note','Your dates are personal study suggestions. Re-check understanding before moving to a dependent topic. Click any activity to explore that topic.'));
  }
  function storage(){
    const status=html('div','storage');root.appendChild(status);
    try{
      if(args.restore){
        if(storageBoot!==args.boot){storageBoot=args.boot;const text=localStorage.getItem(STORAGE_KEY);let saved=null;if(text){if(text.length>200000)throw Error('Backup too large');saved=JSON.parse(text);}value({kind:'restore',data:saved});}
        status.textContent='Loading your progress…';
      }else{localStorage.setItem(STORAGE_KEY,JSON.stringify(args.payload));status.textContent='✓ Progress saved in this browser';}
    }catch(err){status.textContent='Use a backup to keep your progress';if(storageBoot!==args.boot+'-error'){storageBoot=args.boot+'-error';value({kind:'storage_error'});}}
  }
  function render(){
    const signature=JSON.stringify({mode:args.mode,payload:args.payload,restore:args.restore,boot:args.boot,narrow:window.innerWidth<540});
    if(signature===lastSignature)return;lastSignature=signature;root.replaceChildren();group=null;
    if(args.mode==='storage')storage();else if(args.mode==='resources')resourceMap();else if(args.mode==='topics')topicMap();else if(args.mode==='week')weekMap();
    height();requestAnimationFrame(height);
  }
  window.addEventListener('message',e=>{if(e.source!==window.parent||!e.data||e.data.type!=='streamlit:render')return;args=e.data.args||{};render();});
  let resizeTimer,knownWidth=window.innerWidth;
  window.addEventListener('resize',()=>{if(window.innerWidth===knownWidth)return;knownWidth=window.innerWidth;clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{lastSignature='';render();},100);});
  new ResizeObserver(()=>requestAnimationFrame(height)).observe(root);
  post('streamlit:componentReady',{apiVersion:1});
})();
</script></body></html>
